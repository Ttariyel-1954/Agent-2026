# ============================================
# ARTI 2026 - Nginx Konfiqurasiyasi
# ARTI oz serverinin esas reverse proxy-si
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=exam:10m rate=10r/s;

    # Upstream serverlər
    upstream api_gateway {
        server api_gateway:8000;
    }

    upstream agent_service {
        server agent_service:8001;
    }

    upstream assessment_service {
        server assessment_service:8002;
    }

    upstream certification_service {
        server certification_service:8003;
    }

    upstream exam_platform {
        server exam_platform:8004;
    }

    upstream web_portal {
        server web_portal:3001;
    }

    upstream admin_dashboard {
        server admin_dashboard:3002;
    }

    # ===== HTTPS Server =====
    server {
        listen 443 ssl http2;
        server_name arti.edu.az;

        ssl_certificate /etc/nginx/ssl/arti.crt;
        ssl_certificate_key /etc/nginx/ssl/arti.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Ana portal
        location / {
            proxy_pass http://web_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Agent API
        location /api/agent/ {
            proxy_pass http://agent_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Qiymetlendirme API (CAT/MST)
        location /api/assessment/ {
            proxy_pass http://assessment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Sertifikasiya API
        location /api/certification/ {
            proxy_pass http://certification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Imtahan platformasi
        location /exam/ {
            limit_req zone=exam burst=5 nodelay;
            proxy_pass http://exam_platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # WebSocket dəstəyi (real vaxt imtahan)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Admin paneli
        location /admin/ {
            # Yalniz daxili IP-lerden
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://admin_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket (real vaxt melumat toplama)
        location /ws/ {
            proxy_pass http://assessment_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Statik fayllar
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media fayllar
        location /media/ {
            alias /app/media/;
            expires 7d;
        }
    }

    # HTTP -> HTTPS yonlendirme
    server {
        listen 80;
        server_name arti.edu.az;
        return 301 https://$server_name$request_uri;
    }
}
