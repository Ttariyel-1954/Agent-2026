# ARTI 2026 - Prometheus Konfiqurasiyasi
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api_gateway:8000']

  - job_name: 'agent_service'
    static_configs:
      - targets: ['agent_service:8001']

  - job_name: 'assessment_service'
    static_configs:
      - targets: ['assessment_service:8002']

  - job_name: 'certification_service'
    static_configs:
      - targets: ['certification_service:8003']

  - job_name: 'exam_platform'
    static_configs:
      - targets: ['exam_platform:8004']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgresql:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
