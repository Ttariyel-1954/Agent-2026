# =============================================
# ARTI-2026: Docker Compose
# Tam tətbiq yığını
# =============================================

services:
  # R Shiny Tətbiqi
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: arti-2026-app
    restart: unless-stopped
    ports:
      - "3838:3838"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-arti_2026}
      - DB_USER=${DB_USER:-arti_user}
      - DB_PASSWORD=${DB_PASSWORD:-arti_secure_2026}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - GPT_API_KEY=${GPT_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-arti2026_jwt_secret_key}
      - R_CONFIG_ACTIVE=${R_CONFIG_ACTIVE:-production}
    volumes:
      - app-logs:/srv/shiny-server/arti-2026/logs
      - app-uploads:/srv/shiny-server/arti-2026/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL Verilənlər Bazası
  db:
    image: postgres:15-alpine
    container_name: arti-2026-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-arti_2026}
      - POSTGRES_USER=${DB_USER:-arti_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-arti_secure_2026}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=az_AZ.UTF-8 --lc-ctype=az_AZ.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
      - ../database/functions:/docker-entrypoint-initdb.d/functions:ro
      - ../database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    networks:
      - arti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arti_user} -d ${DB_NAME:-arti_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.24-alpine
    container_name: arti-2026-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../www:/usr/share/nginx/html/static:ro
      - nginx-logs:/var/log/nginx
      # SSL sertifikatları (production)
      # - /etc/letsencrypt/live/yourdomain.az:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - arti-network

volumes:
  db-data:
    driver: local
  app-logs:
    driver: local
  app-uploads:
    driver: local
  nginx-logs:
    driver: local

networks:
  arti-network:
    driver: bridge
