# =============================================
# ARTI-2026: Nginx Konfiqurasiyası
# =============================================

# Upstream - Shiny Server
upstream shiny_app {
    server app:3838;
    keepalive 32;
}

# HTTP -> HTTPS yönləndirmə (production)
# server {
#     listen 80;
#     server_name yourdomain.az;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl;  # Production üçün aktivləşdirin
    server_name localhost;

    # SSL konfiqurasiyası (production)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Ümumi parametrlər
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Gzip sıxışdırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # Təhlükəsizlik başlıqları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Statik fayllar
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS və JS
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://shiny_app;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Shiny WebSocket əlaqəsi
    location / {
        proxy_pass http://shiny_app;
        proxy_http_version 1.1;

        # WebSocket dəstəyi
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy başlıqları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout-lar
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffering
        proxy_buffering off;
        proxy_redirect off;
    }

    # Sağlamlıq yoxlama endpoint
    location /health {
        proxy_pass http://shiny_app;
        access_log off;
    }

    # Gizli faylları blokla
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # .env faylını blokla
    location ~ /\.env {
        deny all;
        return 404;
    }

    # Log faylları
    access_log /var/log/nginx/arti-2026-access.log;
    error_log /var/log/nginx/arti-2026-error.log warn;
}
